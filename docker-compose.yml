
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-AlertaClima@2026}
    ports:
      - "1433:1433"

    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"IF DB_ID('alertaclima') IS NULL CREATE DATABASE [alertaclima]; SELECT 1\" || exit 1" ]
      interval: 10s
      retries: 20
      start_period: 30s


  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=alertaclima;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-AlertaClima@2026}
    ports:
      - "8080:8080"
